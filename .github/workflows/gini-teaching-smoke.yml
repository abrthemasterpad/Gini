name: Gini Teaching Smoke

on:
  push:
    branches:
      - feat/gini-teaching-mode-v1-day1
    paths:
      - "scripts/gini-teaching-*.js"
      - "docs/GINI_TEACHING_MODE_V1.md"
      - ".github/workflows/gini-teaching-smoke.yml"
  pull_request:
    paths:
      - "scripts/gini-teaching-*.js"
      - "docs/GINI_TEACHING_MODE_V1.md"
      - ".github/workflows/gini-teaching-smoke.yml"

permissions:
  contents: read

jobs:
  teaching-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Teaching Mode Day 1 smoke test
        run: node scripts/gini-teaching-smoke-test.js
